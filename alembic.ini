# ==============================================================================
# ApexMotion Supplier Risk Intelligence Platform — Alembic Configuration
# ==============================================================================

[alembic]
script_location = src/database/migrations
prepend_sys_path = .
version_path_separator = os

# Fallback default connection URL (dynamically overridden in env.py via src.core.config)
sqlalchemy.url = postgresql://apexmotion_app:local_dev_password@localhost:5432/apexmotion

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
