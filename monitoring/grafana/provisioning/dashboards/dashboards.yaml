apiVersion: 1

providers:
  - name: "ApexMotion Dashboards"
    orgId: 1
    folder: "ApexMotion"
    folderUid: "apexmotion-folder"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
