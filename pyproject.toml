[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apexmotion-risk-platform"
version = "0.1.0"
description = "ApexMotion Supplier Risk Intelligence Platform - Multi-agent AI system for real-time supply chain disruption detection and cryptographic HITL spend governance."
readme = "CLAUDE.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Lokesh", email = "lokesh@euron.consulting" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.35",
    "langchain>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "litellm>=1.50.0",
    "boto3>=1.35.0",
    "cryptography>=43.0.0",
    "opensearch-py>=2.7.0",
    "kafka-python-ng>=2.2.2",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "types-redis>=4.6.0",
    "types-boto3>=1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-p no:logfire -v --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line length violations (handled by ruff format)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
