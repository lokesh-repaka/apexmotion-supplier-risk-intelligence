apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexmotion-worker
  namespace: apexmotion
  labels:
    app: apexmotion-worker
    app.kubernetes.io/name: apexmotion-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: apexmotion-platform
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: apexmotion-worker
  template:
    metadata:
      labels:
        app: apexmotion-worker
        app.kubernetes.io/name: apexmotion-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/apexmotion-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "src.kafka.consumer"]
          envFrom:
            - configMapRef:
                name: apexmotion-config
            - secretRef:
                name: apexmotion-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import src.kafka.consumer; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
