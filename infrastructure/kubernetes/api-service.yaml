apiVersion: v1
kind: Service
metadata:
  name: apexmotion-api
  namespace: apexmotion
  labels:
    app: apexmotion-api
    app.kubernetes.io/name: apexmotion-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: apexmotion-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: apexmotion-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
