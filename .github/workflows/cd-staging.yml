name: ApexMotion CD Pipeline - Staging

"on":
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Custom image tag override (optional)"
        required: false
        default: ""

concurrency:
  group: staging-deployment
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  EKS_CLUSTER_NAME: apexmotion-eks-staging
  K8S_NAMESPACE: apexmotion

jobs:
  pre-deploy-check:
    name: Staging Pre-Deployment Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Kubernetes Manifests Syntax
        run: |
          pip install pyyaml
          python3 -c "import yaml, pathlib; [list(yaml.safe_load_all(open(p))) for p in pathlib.Path('infrastructure/kubernetes').glob('*.yaml')]"
          echo "Kubernetes manifests syntax verified."

  build-and-push-ecr:
    name: Build & Push Images to ECR (Staging)
    needs: [pre-deploy-check]
    environment: staging
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      api_image: ${{ steps.login-ecr.outputs.registry }}/apexmotion-api:${{ steps.set-tag.outputs.tag }}
      worker_image: ${{ steps.login-ecr.outputs.registry }}/apexmotion-worker:${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: set-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/apexmotion-api:${{ steps.set-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/apexmotion-api:staging-latest

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/apexmotion-worker:${{ steps.set-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/apexmotion-worker:staging-latest

  deploy-staging:
    name: Deploy to Amazon EKS (Staging)
    needs: [build-and-push-ecr]
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Manifests via Kustomize
        run: |
          cd infrastructure/kubernetes
          kubectl apply -k .

      - name: Update Deployment Container Images
        run: |
          kubectl set image deployment/apexmotion-api api=${{ needs.build-and-push-ecr.outputs.api_image }} -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/apexmotion-worker worker=${{ needs.build-and-push-ecr.outputs.worker_image }} -n ${{ env.K8S_NAMESPACE }}

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/apexmotion-api -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/apexmotion-worker -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Health Check Verification
        run: |
          echo "Verifying API health probe..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/apexmotion-api -- python3 -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8000/health').getcode() == 200"
          echo "Staging deployment successfully verified."
